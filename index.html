<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rock · Paper · Scissors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Card artwork, drawn once and reused with <use> -->
  <svg class="sprite" aria-hidden="true">
    <defs>
      <pattern id="hatch" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="0.9" height="2.6" fill="#1d1a17"/>
      </pattern>
      <pattern id="hatch-dense" width="1.7" height="1.7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="0.9" height="1.7" fill="#1d1a17"/>
      </pattern>

      <!-- Rock: engraved, faceted boulder lit from the top left -->
      <symbol id="art-rock" viewBox="0 0 80 80">
        <g stroke="#1d1a17" stroke-linejoin="round" stroke-linecap="round">
          <path d="M8 67 Q40 73 72 66" fill="none" stroke-width="1"/>
          <path d="M16 70 l-5 3 M26 71 l-5 3 M36 71.5 l-5 3 M46 71 l-5 3 M56 70 l-5 3 M66 68 l-5 3" stroke-width="0.8"/>
          <path d="M10 44 L18 28 L36 34 L30 64 L14 58 Z" fill="#fbf7ec" stroke-width="1.1"/>
          <path d="M18 28 L32 18 L36 34 Z" fill="#fbf7ec" stroke-width="1.1"/>
          <path d="M32 18 L48 16 L36 34 Z" fill="#fbf7ec" stroke-width="1.1"/>
          <path d="M48 16 L62 24 L54 40 L36 34 Z" fill="url(#hatch)" stroke-width="1.1"/>
          <path d="M62 24 L70 38 L54 40 Z" fill="url(#hatch)" stroke-width="1.1"/>
          <path d="M54 40 L56 62 L30 64 L36 34 Z" fill="url(#hatch)" stroke-width="1.1"/>
          <path d="M70 38 L68 54 L56 62 L54 40 Z" fill="url(#hatch-dense)" stroke-width="1.1"/>
          <path d="M14 58 L10 44 L18 28 L32 18 L48 16 L62 24 L70 38 L68 54 L56 62 L30 64 Z" fill="none" stroke-width="2.2"/>
          <path d="M21 39 l4 6 l-1 6" fill="none" stroke-width="1"/>
          <path d="M15 47 l2 -1 M24 31 l2 -1 M40 22 l2 0" stroke-width="0.8"/>
        </g>
      </symbol>

      <!-- Paper: a letter closed with a red wax seal -->
      <symbol id="art-paper" viewBox="0 0 80 80">
        <g transform="rotate(-5 40 44)" stroke="#1d1a17" stroke-linejoin="round" stroke-linecap="round">
          <path d="M13 28 H73 V66 H13 Z" fill="url(#hatch)" stroke="none"/>
          <path d="M10 24 H70 V62 H10 Z" fill="#fbf7ec" stroke-width="2"/>
          <path d="M70 24 V62 L46 43 Z" fill="url(#hatch)" stroke-width="1.1"/>
          <path d="M10 62 L34 43" fill="none" stroke-width="1.1"/>
          <path d="M10 24 L40 47 L70 24" fill="#fbf7ec" stroke-width="1.6"/>
          <path d="M15 27 L40 44.5 L65 27" fill="none" stroke-width="0.7" opacity="0.55"/>
          <path d="M40 37.5 C44 37 48.5 39.5 48.8 44 C49.5 48 46.5 52.5 41 52.7 C36 53.5 31.5 50 31.6 45 C31 40.5 35 37.7 40 37.5 Z" fill="#a8232a" stroke="#6e1418" stroke-width="1"/>
          <path d="M34.5 51 q-1.2 3.4 1 4.6 q1.8 -1 0.6 -4.4" fill="#a8232a" stroke="#6e1418" stroke-width="0.7"/>
          <circle cx="40.2" cy="45.1" r="4.8" fill="none" stroke="#e7a39b" stroke-width="0.8"/>
          <path d="M40.2 41.9 L41.1 44.2 L43.4 45.1 L41.1 46 L40.2 48.3 L39.3 46 L37 45.1 L39.3 44.2 Z" fill="#e7a39b" stroke="none"/>
        </g>
      </symbol>

      <!-- Scissors: tailor's shears with uneven red handles -->
      <symbol id="art-scissors" viewBox="0 0 80 80">
        <g transform="rotate(-10 40 42)" stroke-linejoin="round" stroke-linecap="round">
          <path d="M43 44 L29 5 Q33.5 25 37.5 40 Z" fill="#1d1a17"/>
          <path d="M42 42 L38.5 44 L47.5 57 L51 55 Z" fill="#1d1a17"/>
          <path d="M37 44 L51 5 Q46.5 25 42.5 40 Z" fill="#1d1a17" stroke="#fbf7ec" stroke-width="0.8"/>
          <path d="M38 42 L41.5 44 L32.5 57 L29 55 Z" fill="#1d1a17" stroke="#fbf7ec" stroke-width="0.8"/>
          <path d="M39.2 37 L49.6 9" stroke="#fbf7ec" stroke-width="0.7"/>
          <path d="M31.5 9 L36 24" stroke="#fbf7ec" stroke-width="0.6" opacity="0.7"/>
          <ellipse cx="27" cy="63" rx="8" ry="7.5" fill="none" stroke="#1d1a17" stroke-width="5.2"/>
          <ellipse cx="27" cy="63" rx="8" ry="7.5" fill="none" stroke="#a8232a" stroke-width="2.4"/>
          <ellipse cx="54" cy="64" rx="11" ry="7.5" transform="rotate(12 54 64)" fill="none" stroke="#1d1a17" stroke-width="5.2"/>
          <ellipse cx="54" cy="64" rx="11" ry="7.5" transform="rotate(12 54 64)" fill="none" stroke="#a8232a" stroke-width="2.4"/>
          <path d="M63.5 69.5 q5 3 2 8" fill="none" stroke="#1d1a17" stroke-width="2.4"/>
          <circle cx="40" cy="38.5" r="3.2" fill="#fbf7ec" stroke="#1d1a17" stroke-width="1.3"/>
          <path d="M38.3 36.8 L41.7 40.2" stroke="#1d1a17" stroke-width="1"/>
        </g>
      </symbol>

      <!-- Small suit marks for the corner index -->
      <symbol id="suit-rock" viewBox="0 0 20 20">
        <path d="M4 14 L3 9 L6 5 L11 3.5 L16 6 L17.5 11 L15 15.5 L8 16.5 Z" fill="currentColor"/>
      </symbol>
      <symbol id="suit-paper" viewBox="0 0 20 20">
        <path d="M2.5 5 H17.5 V15.5 H2.5 Z M2.5 5 L10 11 L17.5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="10" cy="11" r="2.2" fill="currentColor"/>
      </symbol>
      <symbol id="suit-scissors" viewBox="0 0 20 20">
        <path d="M7 2 L12.5 12 M13 2 L7.5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="6.5" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="13.5" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
    </defs>
  </svg>

  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="bar">
    <div class="bar__inner">
      <span class="brand">
        <span class="brand__suits" aria-hidden="true">
          <svg viewBox="0 0 20 20"><use href="#suit-rock"/></svg>
          <svg viewBox="0 0 20 20"><use href="#suit-paper"/></svg>
          <svg viewBox="0 0 20 20"><use href="#suit-scissors"/></svg>
        </span>
        Rock · Paper · Scissors
      </span>
      <div class="bar__actions">
        <button class="icon-btn" id="reset" type="button" aria-label="New game" title="New game (N)">
          <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

      <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden>
        <div class="settings__row">
          <span class="settings__label">First to</span>
          <div class="seg" id="target-seg">
            <button type="button" data-target="3">3</button>
            <button type="button" data-target="5">5</button>
            <button type="button" data-target="7">7</button>
          </div>
        </div>
        <div class="settings__row">
          <span class="settings__label">Effects</span>
          <button class="switch" id="fx-toggle" type="button" role="switch" aria-checked="true" aria-label="Particles and screen shake"></button>
        </div>
        <div class="settings__keys">
          <span class="settings__label">Keys</span>
          <p><kbd>R</kbd> <kbd>P</kbd> <kbd>S</kbd> play a card</p>
          <p><kbd>N</kbd> new game &nbsp; <kbd>Esc</kbd> close</p>
        </div>
        <button class="btn btn--ink" id="settings-new" type="button">New game</button>
      </div>
    </div>
  </header>

  <main class="table" id="table">
    <section class="scoreboard" aria-label="Score">
      <div class="side side--you">
        <span class="who">You</span>
        <span class="num" id="you-score">0</span>
        <div class="pips" id="you-pips"></div>
      </div>
      <span class="vs">first to <span id="target">5</span></span>
      <div class="side side--cpu">
        <span class="who">Computer</span>
        <span class="num" id="cpu-score">0</span>
        <div class="pips" id="cpu-pips"></div>
      </div>
    </section>

    <div class="cpu-hand" id="cpu-hand" aria-hidden="true">
      <!-- face-down fan built by script.js -->
    </div>

    <div class="showdown">
      <div class="spot" id="cpu-spot">
        <span class="spot__label">Computer</span>
        <div class="slot slot--cpu" id="cpu-slot">
          <div class="flipper" id="flipper">
            <div class="card card--back"></div>
            <div class="card card--front" id="cpu-front"></div>
          </div>
        </div>
      </div>
      <span class="showdown__vs">vs</span>
      <div class="spot" id="you-spot">
        <span class="spot__label">You</span>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="hand" id="hand">
      <!-- your cards built by script.js -->
    </div>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="panel">
      <p class="panel__title" id="over-title"></p>
      <p class="panel__score" id="over-score"></p>
      <button class="btn btn--solid" id="again" type="button">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
